<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Zoom stays enabled: blocking it fails WCAG 1.4.4 and iOS ignores the
         restriction anyway, so it only ever hurt Android users -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#667eea">
    <title>Звонки</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667eea' stroke-width='2'%3E%3Cpath d='M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Home Screen -->
        <div id="home-screen" class="screen active">
            <div class="logo">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
            </div>
            <h1>Звонки</h1>
            <p class="subtitle">Быстрые и простые звонки</p>

            <div class="button-group">
                <button id="create-call-btn" class="btn btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"></path>
                    </svg>
                    Создать звонок
                </button>
                <button id="join-call-btn" class="btn btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>
                    </svg>
                    Присоединиться
                </button>
            </div>

            <button id="random-call-btn" class="btn btn-secondary random-call-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M8 12h8M12 8v8"></path>
                </svg>
                Случайный звонок
            </button>

            <div id="random-size" class="random-size hidden">
                <span class="random-size-label">Сколько человек в звонке?</span>
                <div class="random-size-options" role="group" aria-label="Размер группы">
                    <button class="random-size-btn" data-size="2">2</button>
                    <button class="random-size-btn" data-size="3">3</button>
                    <button class="random-size-btn" data-size="4">4</button>
                    <button class="random-size-btn" data-size="5">5</button>
                </div>
            </div>

            <div id="waiting-panel" class="waiting-panel hidden" role="status" aria-live="polite">
                <div class="waiting-spinner" aria-hidden="true"></div>
                <div class="waiting-text" id="waiting-text">Ищем собеседника…</div>
                <video id="waiting-preview" class="waiting-preview" autoplay playsinline muted></video>
                <button id="waiting-cancel-btn" class="btn btn-secondary">Отменить</button>
            </div>

            <div id="join-input-container" class="input-container hidden">
                <input type="text" id="room-id-input" placeholder="Введите код звонка"
                       maxlength="6" autocomplete="off" autocapitalize="characters"
                       spellcheck="false" aria-label="Код звонка" />
                <button id="join-submit-btn" class="btn btn-primary">Войти</button>
            </div>
        </div>

        <!-- Call Screen -->
        <div id="call-screen" class="screen">
            <div class="call-info">
                <div class="room-id-display">
                    <span id="current-room-id"></span>
                    <button id="copy-link-btn" class="icon-btn" title="Скопировать ссылку" aria-label="Скопировать ссылку">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        </svg>
                    </button>
                    <button id="share-telegram-btn" class="icon-btn" title="Поделиться в Telegram" aria-label="Поделиться в Telegram">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
                        </svg>
                    </button>
                    <button id="layout-btn" class="icon-btn" title="Изменить раскладку" aria-label="Изменить раскладку">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </button>
                    <!-- Not in the .controls bar: a sixth round button overflows
                         a 360px viewport, which has no flex-wrap. -->
                    <button id="game-btn" class="icon-btn" title="Пинг-понг" aria-label="Играть в пинг-понг">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M8 3.5c2.5 3 3.5 6 3.5 8.5S10.5 17.5 8 20.5"></path>
                            <circle cx="16" cy="9" r="1.6" fill="currentColor" stroke="none"></circle>
                        </svg>
                    </button>
                </div>

                <!-- Opponent picker, shown only when the call has more than one
                     other participant. Mirrors the layout selector. -->
                <div id="game-menu" class="game-menu hidden" role="menu" aria-label="Выбор соперника"></div>
                <div class="status-bar">
                    <div class="connection-status" id="connection-status">Подключение...</div>
                    <div class="encryption-indicator hidden" id="encryption-indicator">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <span>Защищено E2EE</span>
                    </div>
                </div>

                <!-- Layout selector dropdown -->
                <div id="layout-selector" class="layout-selector hidden">
                    <div class="layout-option" data-layout="grid">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <span>Сетка</span>
                    </div>
                    <div class="layout-option" data-layout="spotlight">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="12"></rect>
                            <rect x="3" y="17" width="5" height="4"></rect>
                            <rect x="10" y="17" width="5" height="4"></rect>
                            <rect x="17" y="17" width="4" height="4"></rect>
                        </svg>
                        <span>Фокус</span>
                    </div>
                    <div class="layout-option" data-layout="sidebar">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="13" height="18"></rect>
                            <rect x="18" y="3" width="3" height="5"></rect>
                            <rect x="18" y="10" width="3" height="5"></rect>
                            <rect x="18" y="17" width="3" height="4"></rect>
                        </svg>
                        <span>Сайдбар</span>
                    </div>
                    <div class="layout-option" data-layout="compact">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                            <rect x="14" y="13" width="6" height="6" rx="1" fill="currentColor" opacity="0.4"></rect>
                        </svg>
                        <span>Компакт</span>
                    </div>
                    <div class="layout-option" data-layout="auto">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2v20M2 12h20M6 6l6 6M18 6l-6 6M6 18l6-6M18 18l-6-6"></path>
                        </svg>
                        <span>Авто</span>
                    </div>
                </div>
            </div>

            <div class="videos-container" id="videos-container" data-participants="0">
                <!-- Video streams will be added dynamically -->
            </div>

            <!-- Ping-pong. A sibling of the video container, never a child of
                 it: updateGridLayout() counts that container's children, so a
                 board inside it would shift every layout rule. -->
            <div id="game-panel" class="game-panel hidden" data-state="waiting">
                <div class="game-scoreboard">
                    <span class="game-score-side">
                        <span class="game-score-name">Вы</span>
                        <span class="game-score-value" id="game-score-you">0</span>
                    </span>
                    <span class="game-score-sep">:</span>
                    <span class="game-score-side">
                        <span class="game-score-value" id="game-score-them">0</span>
                        <span class="game-score-name" id="game-opponent-name">Соперник</span>
                    </span>
                </div>
                <div class="game-board" id="game-board">
                    <canvas id="game-canvas" class="game-canvas" width="300" height="400"></canvas>
                    <div class="game-message hidden" id="game-message"></div>
                </div>
                <div class="game-bar">
                    <span class="game-hint">Ведите пальцем или стрелками ← →</span>
                    <button id="game-exit-btn" class="game-bar-btn" aria-label="Выйти из игры">Выйти</button>
                </div>
            </div>

            <!-- Incoming invitation. Not a toast: .toast is pointer-events:none
                 and self-hides, so it cannot hold buttons. -->
            <div id="game-invite" class="game-invite hidden" role="dialog" aria-live="polite">
                <div class="game-invite-text">
                    <strong>Пинг-понг</strong>
                    <span id="game-invite-from">Участник приглашает сыграть</span>
                </div>
                <div class="game-invite-actions">
                    <button id="game-invite-accept" class="btn btn-primary">Играть</button>
                    <button id="game-invite-decline" class="btn btn-secondary">Позже</button>
                </div>
            </div>

            <!-- Reactions overlay for flying emojis -->
            <div id="reactions-overlay" class="reactions-overlay"></div>

            <!-- Volume control popup -->
            <div id="volume-control" class="volume-control hidden">
                <div class="volume-slider-container">
                    <div class="volume-icon">🔊</div>
                    <input type="range" id="volume-slider" class="volume-slider" min="0" max="200" value="100" step="1">
                    <div class="volume-value" id="volume-value">100%</div>
                </div>
            </div>

            <div class="controls">
                <button id="toggle-audio-btn" class="control-btn active" aria-label="Микрофон">
                    <svg class="audio-on" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                    <svg class="audio-off hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                        <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                        <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>

                <button id="toggle-video-btn" class="control-btn active" aria-label="Камера">
                    <svg class="video-on" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="23 7 16 12 23 17 23 7"></polygon>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                    <svg class="video-off hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>

                <button id="toggle-encryption-btn" class="control-btn active" title="Шифрование включено — нажмите, чтобы предложить выключить" aria-label="Сквозное шифрование">
                    <svg class="encryption-off" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                    <svg class="encryption-on hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        <circle cx="12" cy="16" r="1" fill="currentColor"></circle>
                    </svg>
                </button>

                <button id="reactions-btn" class="control-btn" title="Реакции" aria-label="Реакции">
                    <span class="control-emoji" id="reactions-btn-emoji" aria-hidden="true">🥳</span>
                </button>

                <!-- Reactions dropdown -->
                <div id="reactions-dropdown" class="reactions-dropdown hidden">
                    <div class="reactions-grid" id="reactions-grid">
                        <!-- Reactions will be added dynamically -->
                    </div>
                </div>

                <button id="end-call-btn" class="control-btn end-call" aria-label="Завершить звонок">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Toast notifications -->
            <div id="e2ee-vote" class="e2ee-vote hidden" role="dialog" aria-live="polite">
                <div class="e2ee-vote-text" id="e2ee-vote-text"></div>
                <div class="e2ee-vote-actions">
                    <button id="e2ee-vote-yes" class="btn btn-secondary">Выключить</button>
                    <button id="e2ee-vote-no" class="btn btn-primary">Оставить</button>
                </div>
            </div>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
